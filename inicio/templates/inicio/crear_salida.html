{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'inicio/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <!-- Botón para volver atrás -->
        <a href="{% url 'home' %}" style="color: white; text-decoration: none;"><i class="fas fa-arrow-left"></i></a>
        <h1>{{ titulo }}</h1>
        <div style="width: 20px;"></div> <!-- Espaciador -->
    </header>

    <main class="app-content" style="padding: 20px;">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="id_imagen">Foto del destino</label>
            <div class="upload-area" onclick="document.getElementById('id_imagen').click()">
                <i class="fas fa-image" style="font-size: 2rem; color: var(--primary-green);"></i>
                <p style="margin-top: 10px; color: var(--text-light);">Toca para subir una foto de la ruta</p>
                <input type="file" id="id_imagen" name="imagen" style="display: none;" accept="image/*">
            </div>

            <div class="form-group">
                <label>Destino (Ej. Cerro Provincia)</label>
                <input type="text" class="form-control" name="destino">
            </div>

            <div class="form-group">
                <label>Fecha de la salida</label>
                <input type="date" class="form-control" name="fecha">
            </div>

            <button type="submit" class="btn-dark">Crear Salida</button>
        </form>
    </main>
</body>
</html>
